<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web WiFi Mouse</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
        #trackpad { width: 100%; height: 300px; background: #ffffff; border: 2px dashed #ccc; border-radius: 12px; margin-bottom: 20px; touch-action: none; display: flex; align-items: center; justify-content: center; color: #888; font-size: 1.2rem; }
        input { width: 80%; padding: 12px; font-size: 1rem; border-radius: 6px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h2>Remote Trackpad</h2>
    <div id="trackpad">Touch & drag to move mouse</div>
    <input type="text" id="keyboardInput" placeholder="Type here to send keystrokes...">

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const trackpad = document.getElementById('trackpad');
        let isDragging = false, lastX = 0, lastY = 0;

        trackpad.addEventListener('pointerdown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            let dx = e.clientX - lastX;
            let dy = e.clientY - lastY;
            lastX = e.clientX;
            lastY = e.clientY;
            socket.emit('mouse-move', { dx, dy });
        });

        window.addEventListener('pointerup', () => { isDragging = false; });

        document.getElementById('keyboardInput.addEventListener').oninput = (e) => {};
        const kbInput = document.getElementById('keyboardInput');
        kbInput.addEventListener('keyup', (e) => {
            socket.emit('key-press', { key: e.key });
            kbInput.value = '';
        });
    </script>
</body>
</html>
