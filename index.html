<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700">
        <h1 class="text-3xl font-bold mb-2 text-center bg-gradient-to-r from-red-500 to-pink-500 bg-clip-text text-transparent">
            YouTube Downloader
        </h1>
        <p class="text-slate-400 text-center mb-6 text-sm">Paste a YouTube link below to fetch download options.</p>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">YouTube URL</label>
                <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." 
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-red-500 text-white placeholder-slate-500">
            </div>

            <button onclick="processVideo()" id="fetchBtn" 
                class="w-full py-3 bg-red-600 hover:bg-red-500 transition font-semibold rounded-xl text-white shadow-lg shadow-red-600/30">
                Fetch Video
            </button>
        </div>

        <div id="resultArea" class="mt-8 hidden">
            <!-- Dynamic content injected via script.js -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
