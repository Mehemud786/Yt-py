<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Reel Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-2 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">
            InstaReel Downloader
        </h1>
        <p class="text-slate-400 text-center text-sm mb-6">Paste your Instagram Reel link below to download instantly.</p>
        
        <div class="space-y-4">
            <div>
                <input type="text" id="reelUrl" placeholder="https://www.instagram.com/reel/..." 
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-pink-500 text-sm">
            </div>
            <button onclick="fetchReel()" id="submitBtn"
                class="w-full py-3 bg-gradient-to-r from-purple-500 to-pink-600 font-semibold rounded-lg hover:opacity-90 transition duration-200">
                Get Download Link
            </button>
        </div>

        <div id="loading" class="hidden mt-6 text-center text-slate-400 text-sm animate-pulse">
            Processing your reel, please wait...
        </div>

        <div id="result" class="hidden mt-6 space-y-4 border-t border-slate-700 pt-4">
            <h2 id="videoTitle" class="text-sm font-medium text-slate-300 truncate"></h2>
            <img id="videoThumb" class="w-full h-48 object-cover rounded-lg border border-slate-700" alt="Thumbnail">
            <a id="downloadBtn" href="#" target="_blank"
                class="block text-center py-3 bg-emerald-600 hover:bg-emerald-500 font-semibold rounded-lg transition duration-200">
                Download Video MP4
            </a>
        </div>
    </div>

    <script>
        async function fetchReel() {
            const url = document.getElementById('reelUrl').value;
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const submitBtn = document.getElementById('submitBtn');

            if (!url) {
                alert('Please enter a valid Instagram Reel URL');
                return;
            }

            loading.classList.remove('hidden');
            result.classList.add('hidden');
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('videoTitle').innerText = data.title;
                    document.getElementById('videoThumb').src = data.thumbnail;
                    document.getElementById('downloadBtn').href = data.download_url;
                    result.classList.remove('hidden');
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Something went wrong. Please try again.');
                console.error(err);
            } finally {
                loading.classList.add('hidden');
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
