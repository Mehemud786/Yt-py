<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-xl w-full bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700">
        <h1 class="text-3xl font-extrabold text-center mb-1 text-red-500">YouTube Downloader</h1>
        <p class="text-gray-400 text-center mb-6 text-sm">Powered by Pytubefix & Vercel Serverless</p>
        
        <div class="flex gap-2 mb-6">
            <input type="text" id="urlInput" placeholder="Paste YouTube Video URL here..." 
                class="flex-1 px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-red-500 text-white text-sm">
            <button onclick="fetchVideoInfo()" 
                class="bg-red-600 hover:bg-red-700 px-6 py-3 rounded-lg font-semibold transition-all text-sm">
                Fetch
            </button>
        </div>

        <div id="loading" class="hidden text-center py-4 text-gray-400 text-sm animate-pulse">Fetching video stream details...</div>
        <div id="error" class="hidden text-red-400 text-center py-2 px-3 bg-red-950/50 border border-red-800/50 rounded-lg mb-4 text-sm"></div>

        <div id="resultContainer" class="hidden space-y-4">
            <div class="flex gap-4 items-center bg-gray-900 p-4 rounded-xl border border-gray-700">
                <img id="thumbnail" src="" alt="Thumbnail" class="w-32 h-20 object-cover rounded-lg">
                <div class="overflow-hidden">
                    <h3 id="videoTitle" class="font-bold text-sm line-clamp-2 text-gray-200"></h3>
                    <p id="videoAuthor" class="text-xs text-gray-400 mt-1"></p>
                </div>
            </div>

            <div class="space-y-2">
                <h4 class="font-semibold text-xs uppercase tracking-wider text-gray-400">Available Downloads:</h4>
                <div id="streamsList" class="space-y-2 max-h-56 overflow-y-auto pr-1"></div>
            </div>
        </div>
    </div>

    <script>
        async function fetchVideoInfo() {
            const url = document.getElementById('urlInput').value.trim();
            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            const resultContainer = document.getElementById('resultContainer');
            
            if (!url) {
                errorDiv.innerText = "Please enter a valid YouTube URL.";
                errorDiv.classList.remove('hidden');
                return;
            }

            loading.classList.remove('hidden');
            errorDiv.classList.add('hidden');
            resultContainer.classList.add('hidden');

            try {
                const response = await fetch('/api/info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Failed to fetch video stream.');

                document.getElementById('thumbnail').src = data.thumbnail;
                document.getElementById('videoTitle').innerText = data.title;
                document.getElementById('videoAuthor').innerText = `Channel: ${data.author}`;

                const streamsList = document.getElementById('streamsList');
                streamsList.innerHTML = '';

                data.streams.forEach(stream => {
                    const item = document.createElement('div');
                    item.className = "flex justify-between items-center bg-gray-900 px-4 py-3 rounded-lg border border-gray-700";
                    item.innerHTML = `
                        <span class="text-sm font-medium">Quality: <strong class="text-red-400">${stream.resolution}</strong> (${stream.file_extension.toUpperCase()})</span>
                        <a href="${stream.url}" target="_blank" rel="noopener noreferrer" download class="bg-green-600 hover:bg-green-700 text-xs px-4 py-2 rounded-md font-semibold transition-all">Download</a>
                    `;
                    streamsList.appendChild(item);
                });

                if (data.audio_url) {
                    const audioItem = document.createElement('div');
                    audioItem.className = "flex justify-between items-center bg-gray-900 px-4 py-3 rounded-lg border border-gray-700";
                    audioItem.innerHTML = `
                        <span class="text-sm font-medium">Audio Only <strong class="text-blue-400">(M4A)</strong></span>
                        <a href="${data.audio_url}" target="_blank" rel="noopener noreferrer" download class="bg-blue-600 hover:bg-blue-700 text-xs px-4 py-2 rounded-md font-semibold transition-all">Download Audio</a>
                    `;
                    streamsList.appendChild(audioItem);
                }

                resultContainer.classList.remove('hidden');
            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
