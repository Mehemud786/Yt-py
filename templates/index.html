<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud YouTube Downloader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0000, #0a0a0a);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: rgba(20, 20, 20, 0.85);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(220, 20, 60, 0.25);
            border: 1px solid rgba(220, 20, 60, 0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #ff1a1a, #dc143c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #441a1a;
            background-color: #120505;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
        }
        .quality-label {
            display: block;
            text-align: left;
            font-size: 13px;
            color: #ff9999;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .quality-options {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 12px;
        }
        .quality-options label {
            flex: 1;
            background-color: #1a0505;
            border: 1px solid #441a1a;
            border-radius: 8px;
            padding: 8px 0;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .quality-options input[type="radio"] { display: none; }
        .quality-options label:has(input[type="radio"]:checked) {
            background: linear-gradient(135deg, #ff0033, #dc143c);
            border-color: #ff1a4d;
            box-shadow: 0 0 8px rgba(255, 0, 51, 0.5);
        }
        .audio-option { margin-bottom: 15px; }
        .audio-option label {
            display: block;
            background-color: #1a0505;
            border: 1px solid #441a1a;
            border-radius: 8px;
            padding: 10px 0;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .audio-option input[type="radio"] { display: none; }
        .audio-option label:has(input[type="radio"]:checked) {
            background: linear-gradient(135deg, #b30059, #800040);
            border-color: #ff1a8c;
            box-shadow: 0 0 8px rgba(255, 0, 128, 0.5);
        }
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #ff0033, #b30024);
            color: white;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 0, 51, 0.4);
            margin-bottom: 10px;
        }
        .btn:hover { background: linear-gradient(135deg, #ff1a4d, #cc0029); }
        
        #previewSection {
            display: none;
            margin-top: 15px;
            background: #120505;
            border: 1px solid #441a1a;
            border-radius: 10px;
            padding: 12px;
            text-align: left;
        }
        .thumbnail-img {
            width: 100%;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .video-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .status-text { font-size: 13px; color: #00ff88; font-weight: 600; margin-top: 15px; display: none; }
        .home-btn {
            background: linear-gradient(135deg, #333333, #1a1a1a);
            border: 1px solid #555;
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cloud YouTube Downloader</h1>
        
        <div id="inputStep">
            <input type="text" id="urlInput" placeholder="Paste YouTube URL here...">
            <button class="btn" id="previewBtn" onclick="fetchPreview()">Generate Link & Preview</button>
        </div>

        <div id="previewSection">
            <img id="thumbImg" class="thumbnail-img" src="" alt="Thumbnail">
            <div id="vidTitle" class="video-title"></div>

            <span class="quality-label">Select Download Format:</span>
            <div class="quality-options">
                <label><input type="radio" name="format_type" value="360"><span>360p</span></label>
                <label><input type="radio" name="format_type" value="720" checked><span>720p</span></label>
                <label><input type="radio" name="format_type" value="1080"><span>1080p</span></label>
            </div>

            <div class="audio-option">
                <label><input type="radio" name="format_type" value="audio_320"><span>🎵 MP3 Audio (320kbps)</span></label>
            </div>

            <button class="btn" id="downloadBtn" onclick="startDownload()">Download Media</button>
        </div>

        <div class="status-text" id="statusText">Processing download on server...</div>
        <button class="btn home-btn" id="backHomeBtn" onclick="resetHome()">Back to Home Page</button>
    </div>

    <script>
        let currentUrl = "";

        async function fetchPreview() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) { alert("Please paste a URL first!"); return; }
            currentUrl = url;
            const btn = document.getElementById('previewBtn');
            btn.innerText = "Loading Preview...";
            btn.disabled = true;

            const res = await fetch('/get-info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });
            const data = await res.json();

            if (data.success) {
                document.getElementById('thumbImg').src = data.thumbnail;
                document.getElementById('vidTitle').innerText = data.title;
                document.getElementById('inputStep').style.display = 'none';
                document.getElementById('previewSection').style.display = 'block';
            } else {
                alert("Error: " + data.message);
                btn.innerText = "Generate Link & Preview";
                btn.disabled = false;
            }
        }

        async function startDownload() {
            const formatType = document.querySelector('input[name="format_type"]:checked').value;
            document.getElementById('downloadBtn').innerText = "Downloading...";
            document.getElementById('downloadBtn').disabled = true;
            
            const statusText = document.getElementById('statusText');
            statusText.style.display = 'block';
            statusText.innerText = "Processing request on cloud server...";

            const formData = new FormData();
            formData.append('url', currentUrl);
            formData.append('format_type', formatType);

            const res = await fetch('/start-download', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();

            if (data.success) {
                statusText.innerText = "✅ Download Complete on Server Storage!";
                document.getElementById('backHomeBtn').style.display = 'block';
            } else {
                statusText.innerText = "❌ Error: " + data.message;
                document.getElementById('downloadBtn').innerText = "Download Media";
                document.getElementById('downloadBtn').disabled = false;
            }
        }

        function resetHome() {
            document.getElementById('statusText').style.display = 'none';
            document.getElementById('previewSection').style.display = 'none';
            document.getElementById('inputStep').style.display = 'block';
            document.getElementById('urlInput').value = '';
            document.getElementById('previewBtn').innerText = "Generate Link & Preview";
            document.getElementById('previewBtn').disabled = false;
            document.getElementById('downloadBtn').innerText = "Download Media";
            document.getElementById('downloadBtn').disabled = false;
            document.getElementById('backHomeBtn').style.display = 'none';
        }
    </script>
</body>
</html>
